<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPTV-ZT-Bridge</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;
    background:#0f1020;color:#e0e0e0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .box{text-align:center;padding:32px}
  .dot{width:10px;height:10px;border-radius:50%;background:#00d4ff;
    display:inline-block;margin:0 4px;animation:b 1.2s infinite ease-in-out}
  .dot:nth-child(2){animation-delay:.2s}
  .dot:nth-child(3){animation-delay:.4s}
  @keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}
    40%{opacity:1;transform:translateY(-6px)}}
  p{margin:12px 0;font-size:14px;color:#888}
  a{color:#00d4ff;text-decoration:none}
  a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="box">
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <p>正在打开 IPTV-ZT-Bridge 管理界面…</p>
  <p><a id="link" href="#">若未自动跳转，请点击这里</a></p>
</div>
<script>
(function () {
  var port = 8089;
  var url = 'http://' + location.hostname + ':' + port + '/';
  document.getElementById('link').href = url;
  location.replace(url);
})();
</script>
</body>
</html>
